name: _02_Staging.yml
on:
  push:
    branches:
      - develop
      - release/*

jobs:
  Display_Data:
    runs-on: ubuntu-latest
    steps:
      - run: env | sort

  Build_Push_Docker:
    if: ${{ github.ref_name== 'develop'}}
    uses: ./.github/workflows/z-Docker-Ghcr.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      docker-mode: canary

  #Trivy_Scan:
   # needs: [Build_Push_Docker]
    #uses: ./.github/workflows/02-2_TrivyScan.yml
    #secrets: inherit
    #permissions:
     # contents: read
      #packages: read

  Deploy_Staging:
    uses: ./.github/workflows/02-3_DeployStaging.yml
    needs: [Build_Push_Docker]
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write